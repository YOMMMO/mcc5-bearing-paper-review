name: mcc5-recording-grouped
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12.13
  - pip
  - numpy=2.4.6
  - pandas=3.0.3
  - scipy=1.18.0
  - scikit-learn=1.9.0
  - matplotlib=3.11.0
  - pyarrow=24.0.0
  - pyyaml=6.0.3
  - joblib=1.5.3
  - pip:
      - xgboost==3.3.0
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
